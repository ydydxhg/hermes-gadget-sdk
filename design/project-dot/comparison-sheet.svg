<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Project Dot expression comparison sheet</title>
  <desc id="desc">Eight minimalist black and white face expressions shown in a white device casing.</desc>
  <rect width="1600" height="1120" fill="#FFFFFF"/>
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="36" font-weight="700" fill="#000000">PROJECT DOT — V1 EXPRESSION STUDY</text>
  <text x="800" y="94" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#000000">480 × 480 display geometry · pure black and white · static states</text>

  <defs>
    <g id="device">
      <circle cx="0" cy="0" r="184" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
      <circle cx="0" cy="0" r="164" fill="#000000"/>
    </g>
    <g id="idle">
      <ellipse cx="-60" cy="-23" rx="17" ry="28" fill="#FFFFFF"/>
      <ellipse cx="60" cy="-23" rx="17" ry="28" fill="#FFFFFF"/>
      <path d="M-42 20 C-33 40 -11 40 0 23 C11 40 33 40 42 20" fill="none" stroke="#FFFFFF" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="happy">
      <path d="M-87 -14 Q-60 -49 -33 -14" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
      <path d="M33 -14 Q60 -49 87 -14" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
      <path d="M-40 17 Q0 57 40 17" fill="none" stroke="#FFFFFF" stroke-width="9.5" stroke-linecap="round"/>
    </g>
    <g id="curious">
      <ellipse cx="-60" cy="-20" rx="17" ry="28" fill="#FFFFFF"/>
      <ellipse cx="60" cy="-33" rx="13.5" ry="22" fill="#FFFFFF"/>
      <circle cx="0" cy="27" r="11" fill="none" stroke="#FFFFFF" stroke-width="7.5"/>
    </g>
    <g id="listening">
      <ellipse cx="-60" cy="-25" rx="17.5" ry="31" fill="#FFFFFF"/>
      <ellipse cx="60" cy="-25" rx="17.5" ry="31" fill="#FFFFFF"/>
      <path d="M-16 27 Q0 37 16 27" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
      <circle cx="0" cy="64" r="7" fill="#FFFFFF"/>
    </g>
    <g id="thinking">
      <ellipse cx="-57" cy="-30" rx="15.5" ry="27" transform="rotate(-18 -57 -30)" fill="#FFFFFF"/>
      <ellipse cx="63" cy="-44" rx="15.5" ry="27" transform="rotate(-18 63 -44)" fill="#FFFFFF"/>
      <path d="M-23 31 Q-3 17 17 31" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
    </g>
    <g id="speaking">
      <ellipse cx="-60" cy="-23" rx="17" ry="28" fill="#FFFFFF"/>
      <ellipse cx="60" cy="-23" rx="17" ry="28" fill="#FFFFFF"/>
      <ellipse cx="0" cy="28" rx="15" ry="21" fill="none" stroke="#FFFFFF" stroke-width="8.5"/>
    </g>
    <g id="sleepy">
      <path d="M-87 -25 Q-60 -2 -33 -25" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
      <path d="M33 -25 Q60 -2 87 -25" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
      <path d="M-33 27 C-24 40 -9 40 0 27 C9 40 24 40 33 27" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="confused">
      <ellipse cx="-60" cy="-25" rx="17" ry="28" fill="#FFFFFF"/>
      <path d="M37 -18 L85 -34" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
      <path d="M-39 33 Q-20 13 -1 33 Q18 53 41 30" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>

  <g transform="translate(215 330)"><use href="#device"/><use href="#idle"/><text x="0" y="222" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#000000">IDLE / NEUTRAL</text></g>
  <g transform="translate(605 330)"><use href="#device"/><use href="#happy"/><text x="0" y="222" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#000000">HAPPY</text></g>
  <g transform="translate(995 330)"><use href="#device"/><use href="#curious"/><text x="0" y="222" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#000000">CURIOUS</text></g>
  <g transform="translate(1385 330)"><use href="#device"/><use href="#listening"/><text x="0" y="222" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#000000">LISTENING</text></g>
  <g transform="translate(215 820)"><use href="#device"/><use href="#thinking"/><text x="0" y="222" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#000000">THINKING</text></g>
  <g transform="translate(605 820)"><use href="#device"/><use href="#speaking"/><text x="0" y="222" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#000000">SPEAKING</text></g>
  <g transform="translate(995 820)"><use href="#device"/><use href="#sleepy"/><text x="0" y="222" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#000000">SLEEPY</text></g>
  <g transform="translate(1385 820)"><use href="#device"/><use href="#confused"/><text x="0" y="222" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#000000">ERROR / CONFUSED</text></g>
</svg>
